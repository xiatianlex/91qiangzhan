<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转下载91枪战</title>
    <!-- 以下 meta 为备选自动跳转方式，部分浏览器会执行 -->
    <meta http-equiv="refresh" content="0; url=https://wwbxi.lanzouu.com/b00q1cb6be">
    <style>
        /* 极简风格，保证跳转前瞬间的提示清晰可见 */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            text-align: center;
            color: #1e2b3c;
        }
        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 2.5rem 3rem;
            box-shadow: 0 20px 40px rgba(0,10,30,0.15), 0 4px 12px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.4);
            max-width: 480px;
            margin: 1.5rem;
        }
        h2 {
            font-weight: 500;
            font-size: 1.9rem;
            margin-top: 0;
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
            color: #0b1c2e;
        }
        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(43, 108, 176, 0.15);
            border-radius: 50%;
            border-top-color: #2b6cb0;
            animation: spin 0.9s ease infinite;
            margin: 1.2rem 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p {
            font-size: 1.2rem;
            margin: 0.5rem 0 1.2rem;
            opacity: 0.9;
            font-weight: 350;
        }
        .url-hint {
            background: rgba(0,0,0,0.03);
            padding: 0.7rem 1rem;
            border-radius: 60px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #2a4365;
            word-break: break-all;
            border: 1px solid rgba(0,30,60,0.1);
            margin-bottom: 1.8rem;
        }
        .button {
            display: inline-block;
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 8px 18px rgba(43,108,176,0.25);
            transition: background 0.15s, transform 0.1s;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }
        .button:hover {
            background: #1e4a7a;
            box-shadow: 0 10px 22px rgba(30,74,122,0.3);
        }
        .button:active {
            transform: scale(0.97);
        }
        .footnote {
            margin-top: 1.8rem;
            font-size: 0.9rem;
            opacity: 0.55;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚀 准备跳转</h2>
        <!-- 简易加载动画，表示正在跳转 -->
        <div class="loader"></div>
        <p>您将被引导至91枪战下载页</p>
        <!-- 显示目标地址，保证透明 -->
        <div class="url-hint">
            🔗 https://wwbxi.lanzouu.com/b00q1cb6be        </div>
        <!-- 手动点击按钮备用，同时保留 meta 和 JS 自动跳转 -->
        <a href="https://wwbxi.lanzouu.com/ivzk03j1xzda" class="button" id="manualLink">立即前往</a>
        <div class="footnote">如果未自动跳转，请点击上方按钮</div>
    </div>

    <script>
        (function() {
            // 目标地址
            const targetUrl = 'https://wwbxi.lanzouu.com/b00q1cb6be';

            // 方法1: 直接通过 location.replace 替换当前历史记录，体验更接近重定向
            // 同时保留用户点击返回按钮时不回到这个跳转页 (replace 不留历史)
            // 稍微延迟一点点确保页面和动画已经渲染 (同时备用的 meta 也会在 0 秒后触发, 哪个快算哪个)
            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 80); // 微小的延迟，让界面更自然，但不影响跳转体验

            // 方法2: 额外保险：如果 replace 因为某些原因没工作 (比如被浏览器拦截replace但允许赋值)
            // 但 replace 几乎都有效。再设一个后备定时器，但一般无需
            // 也监听页面可见性变化，如果用户一直停留在页面上超时未跳转(极少情况)，手动点按钮即可。
            // 另外考虑到一些极端情况：部分移动浏览器可能延迟执行 replace, 但无伤大雅

            // 同时也给点击按钮提供良好的体验 (按钮本身已经是链接)
            // 如果用户希望在新标签页打开，可以右键点击，但设计本意是直接跳转
            // 也可以额外强化：左键按钮依然采用 replace 使得后退不回到本页 (但 a 标签默认行为会留下历史)
            // 为了统一，将按钮点击也改成 replace 方式 (保留新标签页能力用右键/中键)
            const btn = document.getElementById('manualLink');
            btn.addEventListener('click', function(e) {
                // 只处理普通左键点击 (button === 0) 且没有修饰键 (避免干扰新标签页打开)
                const isPlainLeftClick = (e.button === 0 && !e.ctrlKey && !e.shiftKey && !e.metaKey && !e.altKey);
                if (isPlainLeftClick) {
                    e.preventDefault();  // 阻止 <a> 的默认跳转(会留下历史)
                    window.location.replace(targetUrl);
                }
                // 其他情况(中键/右键/修饰键+左键)保持原生行为，用户可新标签页打开
            });

            // 极少数老旧浏览器不支持 replace, 再用 location.href 做终极后备 (但一般支持)
            window.addEventListener('load', function() {
                // 如果页面加载后过了 1.5 秒仍然没有离开(可能 replace 失败/被拦截), 则使用 href 强制跳转
                // 但这几乎不会发生。加入以防止特殊情况(比如被 iframe 嵌套限制)
                let fallbackTimer = setTimeout(function() {
                    // 检查当前页面是否仍然是这个跳转页 (通过检测 body 是否存在或某个特征)
                    // 简单判断: 如果仍然可以看到我们的卡片元素，再跳一次
                    const stillHere = document.querySelector('.card') !== null;
                    if (stillHere) {
                        window.location.href = targetUrl;
                    }
                }, 1500);
                // 如果页面被隐藏或卸载，清除计时器也没关系
                // 如果 replace 成功，这计时器永远不会执行
            });
        })();
    </script>

    <!-- 一个零散的保险：noscript 下显示提醒，不过现代浏览器几乎都有js，但万一关闭了js meta会处理 -->
    <noscript>
        <div style="background:#f9e6e6; padding:15px; text-align:center;">
            您的浏览器未启用 JavaScript，请<a href="https://wwbxi.lanzouu.com/ivzk03j1xzda">点击这里</a>手动跳转。
        </div>
    </noscript>
</body>
</html>
